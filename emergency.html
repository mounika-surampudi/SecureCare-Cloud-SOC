<!DOCTYPE html>
<html><head><title>Emergency SOS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#000;color:white;text-align:center}.emergency-card{background:#1a0000;border:3px solid red;border-radius:20px;box-shadow:0 0 30px red}.btn-sos{background:red;color:white;font-size:24px;padding:20px;border-radius:50%;width:150px;height:150px;animation:pulse 1.5s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,0,0,0.7)}70%{box-shadow:0 0 0 20px rgba(255,0,0,0)}100%{box-shadow:0 0 0 0 rgba(255,0,0,0)}}</style></head>
<body>
<div class="container mt-5"><div class="emergency-card p-5 mx-auto" style="max-width:500px"><h2 class="text-danger">🚨 EMERGENCY SOS</h2><p>Andhra Pradesh Emergency Response</p><button class="btn btn-sos mt-4" onclick="sos()">SOS</button><p class="mt-4" style="font-size:13px">Click SOS - Will call nearest hospital + share location</p><div id="nearest" class="mt-4 text-start"></div></div></div>
<script>
async function loadNearest(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async pos=>{
      let res = await fetch(`/api/nearby?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
      let data = await res.json();
      let h = data.nearest_hospitals[0];
      document.getElementById('nearest').innerHTML = `<div class='card bg-black p-3'><b>Nearest: ${h.name}</b><br>📍 ${h.distance} km away<br>📞 ${h.contact}<br><a href="tel:${h.contact}" class="btn btn-danger w-100 mt-2">📞 Call Now</a><a href="https://www.google.com/maps/dir/?api=1&destination=${h.lat},${h.lon}" target="_blank" class="btn btn-warning w-100 mt-2">🧭 Direction</a></div>`;
      window.nearestHospital = h;
    });
  }
}
function sos(){
  if(window.nearestHospital){
    alert(`🚨 SOS Alert! Calling ${window.nearestHospital.name} - ${window.nearestHospital.contact}\nLocation shared: ${window.nearestHospital.lat},${window.nearestHospital.lon}`);
    window.location.href = `tel:${window.nearestHospital.contact}`;
  } else { alert("Finding nearest hospital..."); loadNearest(); }
}
loadNearest();
</script>
</body></html>
